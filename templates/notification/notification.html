<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Friend Request Notifications</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background-color: #f4f4f4;
        }

        .container {
            width: 60%;
            max-width: 600px;
            background-color: white;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
        }

        h2 {
            text-align: center;
            color: #333;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            font-weight: bold;
        }

        .form-group input {
            width: 100%;
            padding: 8px;
            font-size: 16px;
            border: 1px solid #ddd;
            border-radius: 4px;
        }

        .form-group button {
            width: 100%;
            padding: 10px;
            background-color: #4CAF50;
            color: white;
            border: none;
            font-size: 16px;
            cursor: pointer;
            border-radius: 4px;
        }

        .form-group button:hover {
            background-color: #45a049;
        }

        .notification-list {
            margin-top: 20px;
        }

        .notification-item {
            background-color: #f9f9f9;
            padding: 15px;
            margin-bottom: 10px;
            border-radius: 4px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.1);
        }

        .notification-item button {
            padding: 5px 10px;
            font-size: 14px;
            background-color: #007BFF;
            color: white;
            border: none;
            cursor: pointer;
            border-radius: 4px;
        }

        .notification-item button:hover {
            background-color: #0056b3;
        }

        .status {
            font-size: 12px;
            color: #666;
        }

    </style>
</head>
<body>

    <div class="container">
        <h2>Friend Request & Notifications</h2>

        <div class="form-group">
            <label for="username">Enter your username:</label>
            <input type="text" id="username" placeholder="Username">
            <button id="register-btn">Register</button>
        </div>

        <div class="form-group">
            <label for="friend-username">Send a friend request to:</label>
            <input type="text" id="friend-username" placeholder="Friend's Username">
            <button id="send-request-btn">Send Friend Request</button>
        </div>

        <div class="notification-list">
            <h3>Notifications</h3>
            <div id="notifications"></div>
        </div>
    </div>

    <script src="https://cdn.socket.io/4.5.0/socket.io.min.js"></script>
    <script>
        const socket = io("http://localhost:2222/friends"); // Replace with your server URL
        let currentUsername = '';

        document.getElementById('register-btn').addEventListener('click', () => {
            const username = document.getElementById('username').value;
            if (username) {
                currentUsername = username;
                socket.emit('register', { username });
            } else {
                alert('Please enter a valid username');
            }
        });

        document.getElementById('send-request-btn').addEventListener('click', () => {
            const friendUsername = document.getElementById('friend-username').value;
            if (friendUsername) {
                socket.emit('send-friend-request', { sender: currentUsername, recipient: friendUsername });
            } else {
                alert('Please enter a friend username');
            }
        });

        socket.on('notification', (notification) => {
            const notificationList = document.getElementById('notifications');
            const notificationItem = document.createElement('div');
            notificationItem.classList.add('notification-item');
            notificationItem.innerHTML = `
                <span>${notification.sender} has sent you a friend request.</span>
                <span class="status">${notification.status}</span>
                <button>Accept</button>
            `;
            notificationList.appendChild(notificationItem);
        });

        socket.on('notifications', (notifications) => {
            const notificationList = document.getElementById('notifications');
            notificationList.innerHTML = '';
            notifications.forEach((notification) => {
                const notificationItem = document.createElement('div');
                notificationItem.classList.add('notification-item');
                notificationItem.innerHTML = `
                    <span>${notification.sender} has sent you a friend request.</span>
                    <span class="status">${notification.status}</span>
                    <button>Accept</button>
                `;
                notificationList.appendChild(notificationItem);
            });
        });
    </script>
</body>
</html>
