<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Home</title>
  <style>
    /* Basic styling */
    body {
      font-family: Arial, sans-serif;
      margin: 0;
      padding: 0;
      background-color: #f4f4f4;
    }
    .container {
      max-width: 600px;
      margin: 50px auto;
      padding: 20px;
      background: #fff;
      border-radius: 8px;
      box-shadow: 0 2px 5px rgba(0, 0, 0, 0.2);
      text-align: center;
    }
    h1 {
      margin-bottom: 20px;
    }
    button {
      margin: 10px;
      padding: 15px 30px;
      font-size: 16px;
      border: none;
      border-radius: 5px;
      cursor: pointer;
      color: #fff;
      background-color: #007bff;
    }
    button:hover {
      background-color: #0056b3;
    }
    .logout {
      margin-top: 20px;
      padding: 10px 20px;
      background-color: #dc3545;
    }
    button.logout:hover {
      background-color: #a71d2a;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>Welcome to the Chat App</h1>
    <button id="send-request">Send Friend Request</button>
    <button id="enter-chat">Enter Chat</button>
    <button id="logout" class="logout">Logout</button>
  </div>

  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const BASE_URL = 'http://localhost:2222'; // Replace with your backend URL

      // Navigate to Send Friend Request Page
      document.getElementById('send-request').addEventListener('click', () => {
        window.location.href = './send-request.html';
      });

      // Navigate to Enter Chat Page
      document.getElementById('enter-chat').addEventListener('click', () => {
        window.location.href = './chat.html';
      });

      // Logout Functionality
      document.getElementById('logout').addEventListener('click', () => {
        // Clear tokens or session data
        localStorage.removeItem('token');
        localStorage.removeItem('claim');
        window.location.href = './index.html'; // Redirect to login page
      });
    });
  </script>
</body>
</html>
